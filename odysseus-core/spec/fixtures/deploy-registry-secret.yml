# spec/fixtures/deploy-registry-secret.yml
# Like deploy-registry.yml, but the credential comes from password_secret
# rather than the literal password -- the shape Finding 1's regression
# covers: a builder that only ever read registry[:password] saw this as no
# credential at all.

service: myapp
image: myapp-production

registry:
  server: ghcr.io
  username: wa
  password_secret: REGISTRY_TOKEN

servers:
  web:
    hosts:
      - app1.example.com

ssh:
  user: root
  keys:
    - ~/.ssh/id_ed25519
