# spec/fixtures/deploy-accessories.yml
# Two accessories over two hosts: redis serves both hosts, sidekiq serves
# only the first, so accessory-then-host result ordering is provable (redis
# before sidekiq; acc1 before acc2 within redis) and so a verb's result Hash
# has more than one key to prove it is host-keyed rather than overwritten.

service: myapp
image: myapp-production

servers:
  web:
    hosts:
      - web1.example.com

accessories:
  redis:
    image: redis:7
    hosts:
      - acc1.example.com
      - acc2.example.com
  sidekiq:
    image: sidekiq:latest
    hosts:
      - acc1.example.com

ssh:
  user: root
  keys:
    - ~/.ssh/id_ed25519
